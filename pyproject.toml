[project]
name = "mai-scale"
version = "0.1.0"
description = "A playful McDonald's MCP-powered measurement converter"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["cli.py", "scale.py", "mcd_client.py", "server.py", "static"]
